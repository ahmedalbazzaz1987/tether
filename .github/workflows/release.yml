# Publishes a GitHub release automatically whenever mac/VERSION or
# RELEASE_NOTES.md changes on main (tag v<VERSION>). The apps' built-in
# updater downloads the files attached here.
#
# To ship an update: bump the version (see README), refresh
# prebuilt/Tether-macOS.zip with ./mac/build.sh --release, edit
# RELEASE_NOTES.md, commit and push.
name: Release
on:
  push:
    branches: [main]
    paths: ["mac/VERSION", "RELEASE_NOTES.md"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Build
        working-directory: windows
        env:
          GOPROXY: direct
          GOSUMDB: "off"
        run: |
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-s -w -H windowsgui" -o ../dist/Tether-Windows-x64.exe ./cmd/tether
          GOOS=windows GOARCH=arm64 go build -trimpath -ldflags="-s -w -H windowsgui" -o ../dist/Tether-Windows-arm64.exe ./cmd/tether
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  macos:
    runs-on: macos-15
    continue-on-error: true   # falls back to prebuilt/Tether-macOS.zip if the runner can't build
    steps:
      - uses: actions/checkout@v4
      - name: Build
        working-directory: mac
        run: ./build.sh --release
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: mac/build/Tether-macOS.zip

  release:
    needs: [windows, macos]
    if: always() && needs.windows.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "version=$(tr -d '[:space:]' < mac/VERSION)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Mac fallback
        run: |
          if [ ! -f dist/Tether-macOS.zip ] && [ -f prebuilt/Tether-macOS.zip ]; then
            cp prebuilt/Tether-macOS.zip dist/
          fi
          ls -la dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: Tether ${{ steps.v.outputs.version }}
          body_path: RELEASE_NOTES.md
          target_commitish: ${{ github.sha }}
          make_latest: "true"
          files: dist/*
