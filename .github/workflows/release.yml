# Builds Tether for Windows (and macOS) when you push a tag like v1.0.1,
# and attaches the files to a GitHub release. The apps' built-in updater
# downloads these files.
name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Build
        working-directory: windows
        env:
          GOPROXY: direct
          GOSUMDB: "off"
        run: |
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-s -w -H windowsgui" -o ../dist/Tether-Windows-x64.exe ./cmd/tether
          GOOS=windows GOARCH=arm64 go build -trimpath -ldflags="-s -w -H windowsgui" -o ../dist/Tether-Windows-arm64.exe ./cmd/tether
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  macos:
    runs-on: macos-15
    continue-on-error: true   # if this fails, build on your Mac with ./build.sh --release and upload the zip by hand
    steps:
      - uses: actions/checkout@v4
      - name: Build
        working-directory: mac
        run: ./build.sh --release
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: mac/build/Tether-macOS.zip

  release:
    needs: [windows, macos]
    if: always() && needs.windows.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
